version: "2.4"

volumes:
  orderer8.example.com:

networks:
  byfn:

services:

  orderer8.example.com:
    container_name: orderer8.example.com
    image: hyperledger/fabric-orderer:$IMAGE_TAG
    # blkio_config:
    #   device_write_iops:
    #     - path: /dev/sdc
    #      rate: 40
    environment:
      - ORDERER_GENERAL_LISTENPORT=7050
      - FABRIC_LOGGING_SPEC=DEBUG
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # enabled TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    #extends:
    #  file: base/peer-base.yaml
    #  service: orderer-base
    volumes:
        - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ./crypto-config/ordererOrganizations/example.com/orderers/orderer8.example.com/msp:/var/hyperledger/orderer/msp
        - ./crypto-config/ordererOrganizations/example.com/orderers/orderer8.example.com/tls/:/var/hyperledger/orderer/tls
        - orderer8.example.com:/var/hyperledger/production/orderer
    extra_hosts:
        - "peer0.org1.example.com:10.0.3.6"
        - "peer0.org2.example.com:10.0.3.9"
        - "peer0.org3.example.com:10.0.3.10"
        - "peer0.org4.example.com:10.0.3.14"
        - "peer0.org5.example.com:10.0.3.16"
        - "peer0.org6.example.com:10.0.3.17"
        - "peer0.org7.example.com:10.0.3.19"
        - "peer0.org8.example.com:10.0.3.21"
        - "orderer.example.com:10.0.3.23"
        - "orderer2.example.com:10.0.3.24"
        - "orderer3.example.com:10.0.3.25"
        - "orderer4.example.com:10.0.3.33"
        - "orderer5.example.com:10.0.3.40"
        - "orderer6.example.com:10.0.3.66"
        - "orderer7.example.com:10.0.3.72"
        - "orderer8.example.com:10.0.3.74"
        - "orderer9.example.com:10.0.3.76"
        - "orderer10.example.com:10.0.3.80"
        - "orderer11.example.com:10.0.3.103"
        - "orderer12.example.com:10.0.3.133"
        - "orderer13.example.com:10.0.3.147"
        - "orderer14.example.com:10.0.3.152"
        - "orderer15.example.com:10.0.3.154"
    ports:
      - 7050:7050
    networks:
      - byfn
